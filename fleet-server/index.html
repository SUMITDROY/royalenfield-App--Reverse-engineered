<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tripper fleet manager</title><link rel="stylesheet" href="/style.css"><body><main><h1>Tripper fleet manager</h1><p>Self-hosted experimental relay. Riders must explicitly enable sharing. Last reported locations are not guaranteed live. Tokens stay in memory until this tab closes.</p><label>Manager token <input id="token" type="password" autocomplete="off"></label><button id="refresh">Refresh fleet</button><button id="logout">Forget token</button><p id="status" role="status"></p><h2>Assign route / group</h2><form id="assign"><label>Rider ID <input name="user" required maxlength="100"></label><label>Title <input name="title" required maxlength="1000"></label><label>Destination <input name="destination" required maxlength="1000"></label><label>Notes / meeting point <input name="notes" maxlength="1000"></label><label>Group name (optional; group riders can see each other's recent shared points) <input name="group" maxlength="1000"></label><button>Assign</button></form><h2>Riders and latest reports</h2><div id="riders"></div><h2>Shared trip history (retention limited)</h2><div id="rides"></div><h2>Assigned routes</h2><div id="routes"></div></main><script src="/dashboard.js"></script></body></html>
